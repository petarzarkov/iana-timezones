name: Build CI

# Deprecated: development moved to https://github.com/petarzarkov/arkv
# (packages/timezones). The weekly IANA refresh and the npm publish steps that used
# to live here now run in that repo, so this workflow only checks the code still
# builds on push.
on:
  push:
    branches: [main]

permissions:
  contents: write
  pages: write
  id-token: write

env:
  CI: true
jobs:
  build:
    runs-on: ubuntu-latest
    name: Build
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Setup bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.13
      - name: Install
        run: bun install --frozen-lockfile
      - name: Typecheck
        run: bun run typecheck
      - name: Lint
        run: bun run lint
      - name: Test Coverage
        run: bun run test:cov
      - name: Install badgen-cli and Generate Coverage Badge
        run: |
          bun add -g badgen-cli

          COV=$(bun -e 't=require(`./coverage/coverage-summary.json`).total,process.stdout.write(String(Math.min(...`lines|statements|functions|branches`.split(`|`).map(k=>t[k].pct))))')

          if [ "$COV" -ge 95 ]; then
            COLOR="green"
          else
            COLOR="orange"
          fi

          badgen -j coverage -s $COV% -c $COLOR > coverage/coverage.svg
      - name: Setup Pages
        if: github.ref == format('refs/heads/{0}', github.event.repository.default_branch) && success()
        uses: actions/configure-pages@v4
      - name: Upload artifact
        if: github.ref == format('refs/heads/{0}', github.event.repository.default_branch) && success()
        uses: actions/upload-pages-artifact@v3
        with:
          path: './coverage'
      - name: Deploy to GitHub Pages
        if: github.ref == format('refs/heads/{0}', github.event.repository.default_branch) && success()
        id: deployment
        uses: actions/deploy-pages@v4
      - name: Build
        run: bun run build
